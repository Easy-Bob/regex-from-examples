_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Write a regex, proven exactly right or wrong"
summary: "Pick a text format such as a 24-hour time, a hex colour or a number from 0 to 255. An agent writes a regex from its description and examples, and a verifier checks it against every possible string, naming the shortest one it gets wrong."
highlights:
  - "Exact verdicts: any equivalent regex passes, however it is written"
  - "Each wrong regex comes with the shortest string it gets wrong"
  - "Its own regex engine, so no pattern can hang the checker"
steps:
  - "Ask for a regex for one of the formats: time24, hex_color, semver, us_zip, octet, identifier, slug or price"
  - "The agent reads the description and examples, writes a pattern and tests it"
  - "It submits the pattern, and the verdict card shows whether it is exactly right"
